name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # The source-compatibility probes build the 2.17.0 and 2.18.0 tags.
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Verify Swift version
        shell: bash
        run: |
          version="$(swift --version 2>&1)"
          echo "$version"
          echo "$version" | grep -q "Swift version 6\.4"
      - name: Build
        run: swift build
      - name: Test
        run: Scripts/test-fixture-cleanup.sh swift test
      - name: Test (Archive trait)
        run: Scripts/test-fixture-cleanup.sh swift test --traits Archive
      - name: Public enum-case inventory
        run: ENUM_CASES_SCRATCH="$RUNNER_TEMP/GitKit-enum-cases" Scripts/check-enum-cases.sh
      - name: Source-compatibility probes
        run: COMPAT_SCRATCH="$RUNNER_TEMP/GitKit-compat" Scripts/check-source-compat.sh

  ios:
    name: iOS
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Verify Swift version
        shell: bash
        run: |
          version="$(swift --version 2>&1)"
          echo "$version"
          echo "$version" | grep -q "Swift version 6\.4"
      # Cross-compile only — iOS runs on devices/simulators; the API is identical
      # to macOS, which runs the test suite above.
      - name: Build (iOS)
        run: xcodebuild build -scheme GitKit -destination 'generic/platform=iOS' -skipMacroValidation

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.2-jammy
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # The source-compatibility probes build the 2.17.0 and 2.18.0 tags.
          fetch-depth: 0
      - name: Install C dependencies
        # libgit2 links -lz (zlib); HTTPS uses OpenSSL via dlopen at runtime.
        # bz2/lzma/zstd back swift-archive's filters for the Archive-trait run.
        # rsync and python3 are used by the source-compatibility scripts.
        run: |
          apt-get update
          apt-get install -y zlib1g-dev libssl-dev pkg-config ca-certificates \
            libbz2-dev liblzma-dev libzstd-dev rsync python3
      - name: Trust the checkout
        # The container user does not own the workspace; the probes read tags
        # and the libgit2 submodule with git.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/vendor/libgit2"
      - name: Verify Swift version
        shell: bash
        run: |
          version="$(swift --version 2>&1)"
          echo "$version"
          echo "$version" | grep -q "Swift version 6\.4"
      - name: Build
        run: swift build
      - name: Test
        run: Scripts/test-fixture-cleanup.sh swift test
      - name: Test (Archive trait)
        run: Scripts/test-fixture-cleanup.sh swift test --traits Archive
      - name: Public enum-case inventory
        run: ENUM_CASES_SCRATCH="$RUNNER_TEMP/GitKit-enum-cases" Scripts/check-enum-cases.sh
      - name: Source-compatibility probes
        run: COMPAT_SCRATCH="$RUNNER_TEMP/GitKit-compat" Scripts/check-source-compat.sh

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4.2"
      - name: Verify Swift version
        shell: bash
        run: |
          version="$(swift --version 2>&1)"
          echo "$version"
          echo "$version" | grep -q "Swift version 6\.4"
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build & test (Android emulator)
        uses: skiptools/swift-android-action@v2
        with:
          # Must exist in BOTH the swift.org host-toolchain feed and the
          # swift-android-toolchain SDK feed.
          swift-version: "6.4.2"
          free-disk-space: true
      - name: Verify Swift version
        shell: bash
        run: |
          version="$(swift --version 2>&1)"
          echo "$version"
          echo "$version" | grep -q "Swift version 6\.4"
